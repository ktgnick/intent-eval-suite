services:
  - type: web
    name: intent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set this in the Render dashboard, never in the repo
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false   # set to the dashboard's site URL, e.g. https://<bucket>.s3-website-<region>.amazonaws.com, plus http://localhost:4200 for local work
