services:
  - type: web
    name: review-api
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false   # the GitHub Pages origin: https://ktgnick.github.io (no path)
